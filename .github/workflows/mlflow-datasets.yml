name: Dataset Versioning

# Requiere que los CSV de MiBici estén disponibles en data/raw del runner,
# por eso se dispara manualmente (en push fallaba al no haber datos).
on:
  workflow_dispatch:

jobs:
  dataset:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: make data features
